name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build LungeSwap
        working-directory: lungeswap
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: lungeswap-jar
          path: |
            lungeswap/build/libs/*.jar
            !lungeswap/build/libs/*-sources.jar
